<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs>
  <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#EEF6FF"/>
    <stop offset="100%" stop-color="#F8FBFF"/>
  </linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#4F9EF0"/>
  </marker>
</defs>

<rect x="0" y="0" width="1600" height="950" rx="0" fill="url(#flowBg)" />
<text x="800" y="72" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="#2F3440" font-weight="bold" text-anchor="middle">核心流程 A：建档与主线生成</text>
<rect x="60" y="150" width="320" height="150" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="220" y="184" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">1. 欢迎页</text>
<text x="82" y="220" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="82" dy="0">打字动画建立仪式感，并提供注册/登录</tspan><tspan x="82" dy="21">双入口。</tspan></text>
<rect x="430" y="150" width="320" height="150" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="590" y="184" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">2. 角色选择</text>
<text x="452" y="220" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start">学者、骑士、旅者三条人格化成长路径。</text>
<rect x="800" y="150" width="320" height="150" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="960" y="184" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">3. 填写目标</text>
<text x="822" y="220" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="822" dy="0">输入账号、目标、周期、每日可投入时间</tspan><tspan x="822" dy="21">。</tspan></text>
<rect x="1170" y="150" width="320" height="150" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="1330" y="184" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">4. 初始化 Agent</text>
<text x="1192" y="220" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="1192" dy="0">生成主线章节、开场叙事与首批三项任务</tspan><tspan x="1192" dy="21">。</tspan></text>
<rect x="245" y="470" width="390" height="170" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="440" y="504" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">5. 查看初始化结果</text>
<text x="267" y="540" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="267" dy="0">展示角色世界观、当前章节与任务清单，</tspan><tspan x="267" dy="21">降低首次进入的认知负担。</tspan></text>
<rect x="930" y="470" width="420" height="170" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="1140" y="504" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">6. 进入主页</text>
<text x="952" y="540" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="952" dy="0">开始日常任务推进，并在后续形成连续成</tspan><tspan x="952" dy="21">长闭环。</tspan></text>
<line x1="380" y1="225" x2="430" y2="225" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="750" y1="225" x2="800" y2="225" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="1120" y1="225" x2="1170" y2="225" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="1330" y1="300" x2="1090" y2="470" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="800" y1="555" x2="930" y2="555" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="585" y1="470" x2="585" y2="300" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
</svg>