<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
<defs>
  <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#EEF6FF"/>
    <stop offset="100%" stop-color="#F8FBFF"/>
  </linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#4F9EF0"/>
  </marker>
</defs>

<rect x="0" y="0" width="1600" height="950" rx="0" fill="url(#flowBg)" />
<text x="800" y="72" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="#2F3440" font-weight="bold" text-anchor="middle">核心流程 B：任务完成到剧情/记忆沉淀</text>
<rect x="70" y="140" width="300" height="150" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="220" y="174" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">1. 选择任务</text>
<text x="92" y="210" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="92" dy="0">从主线或支线任务中选择当下最小行动单</tspan><tspan x="92" dy="21">元。</tspan></text>
<rect x="430" y="140" width="300" height="150" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="580" y="174" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">2. 开启专注之旅</text>
<text x="452" y="210" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="452" dy="0">弹窗确认投入时长，可进入专注或直接结</tspan><tspan x="452" dy="21">算。</tspan></text>
<rect x="790" y="140" width="300" height="150" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="940" y="174" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">3. 专注/休息双态</text>
<text x="812" y="210" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="812" dy="0">专注计时与休息切换，降低疲劳导致的中</tspan><tspan x="812" dy="21">断。</tspan></text>
<rect x="1150" y="140" width="300" height="150" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="1300" y="174" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">4. 完成结算</text>
<text x="1172" y="210" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="1172" dy="0">任务完成后进入剧情生成与奖励写入流程</tspan><tspan x="1172" dy="21">。</tspan></text>
<rect x="70" y="500" width="320" height="180" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="230" y="534" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">5. 剧情反馈卡</text>
<text x="92" y="570" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="92" dy="0">展示故事文本、奖励总结与角色化反馈，</tspan><tspan x="92" dy="21">放大正向感受。</tspan></text>
<rect x="450" y="500" width="320" height="180" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="610" y="534" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">6. 记忆入树</text>
<text x="472" y="570" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="472" dy="0">写入 L1 短期记忆，并在必要时更新</tspan><tspan x="472" dy="21">世界实体。</tspan></text>
<rect x="830" y="500" width="320" height="180" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="990" y="534" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">7. 主线收束</text>
<text x="852" y="570" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="852" dy="0">若阶段任务完成，则生成章节终章并提示</tspan><tspan x="852" dy="21">下一目标。</tspan></text>
<rect x="1210" y="500" width="320" height="180" rx="24" fill="#FFFFFF" stroke="#D9EAF7" stroke-width="2" />
<text x="1370" y="534" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#2F3440" font-weight="bold" text-anchor="middle">8. 新赛季开启</text>
<text x="1232" y="570" font-family="Droid Sans Fallback, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6C7A89" font-weight="normal" text-anchor="start"><tspan x="1232" dy="0">归档赛季纪要与称号，形成可持续成长履</tspan><tspan x="1232" dy="21">历。</tspan></text>
<line x1="370" y1="215" x2="430" y2="215" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="730" y1="215" x2="790" y2="215" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="1090" y1="215" x2="1150" y2="215" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="1300" y1="290" x2="1300" y2="500" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="1210" y1="590" x2="1150" y2="590" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="830" y1="590" x2="770" y2="590" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="450" y1="590" x2="390" y2="590" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
<line x1="220" y1="500" x2="220" y2="290" stroke="#4F9EF0" stroke-width="5" marker-end="url(#arrow)" />
</svg>